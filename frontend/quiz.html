<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Football - LPA</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <style>
        :root {
            --primary: #001B48;
            --secondary: #000B1E;
            --accent: #FFD700;
            --accent-glow: rgba(255, 215, 0, 0.4);
            --text: #F8FAFC;
            --text-muted: #94A3B8;
            --success: #22c55e;
            --error: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle at top right, var(--primary), var(--secondary));
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Background Animation */
        .bg-particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background: linear-gradient(45deg, transparent 45%, rgba(255, 215, 0, 0.02) 50%, transparent 55%);
            background-size: 200% 200%;
            animation: shimmer 15s infinite linear;
        }

        @keyframes shimmer {
            0% {
                background-position: -200% -200%;
            }

            100% {
                background-position: 200% 200%;
            }
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
            position: relative;
            z-index: 1;
        }

        /* Header */
        header {
            text-align: center;
            margin-bottom: 50px;
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 900;
            background: linear-gradient(to right, #fff, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 1.2rem;
        }

        /* Quiz Card */
        .quiz-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 25px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        /* Timer */
        .timer-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid rgba(255, 215, 0, 0.2);
        }

        .timer {
            font-size: 2.5rem;
            font-weight: 900;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .timer.warning {
            color: var(--error);
            animation: pulse 1s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }
        }

        .question-counter {
            font-size: 1.2rem;
            color: var(--text-muted);
        }

        /* Question */
        .question-section {
            margin-bottom: 40px;
        }

        .question-text {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 30px;
            line-height: 1.4;
        }

        /* Options */
        .options-grid {
            display: grid;
            gap: 15px;
        }

        .option {
            background: rgba(255, 255, 255, 0.03);
            border: 2px solid rgba(255, 215, 0, 0.2);
            border-radius: 15px;
            padding: 20px 25px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .option:hover {
            background: rgba(255, 215, 0, 0.1);
            border-color: var(--accent);
            transform: translateX(10px);
        }

        .option-letter {
            width: 40px;
            height: 40px;
            background: var(--accent);
            color: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 1.2rem;
            flex-shrink: 0;
        }

        .option.selected {
            background: rgba(255, 215, 0, 0.15);
            border-color: var(--accent);
            box-shadow: 0 0 20px var(--accent-glow);
        }

        .option.correct {
            background: rgba(34, 197, 94, 0.2);
            border-color: var(--success);
        }

        .option.incorrect {
            background: rgba(239, 68, 68, 0.2);
            border-color: var(--error);
        }

        .option.disabled {
            pointer-events: none;
            opacity: 0.6;
        }

        /* Buttons */
        .btn-container {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        .btn {
            flex: 1;
            padding: 18px 30px;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
        }

        .btn-primary {
            background: var(--accent);
            color: var(--primary);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px var(--accent-glow);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Results */
        .results-card {
            text-align: center;
        }

        .score-display {
            font-size: 5rem;
            font-weight: 900;
            color: var(--accent);
            margin: 30px 0;
        }

        .score-message {
            font-size: 1.5rem;
            margin-bottom: 20px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin: 40px 0;
        }

        .stat-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 15px;
            border: 1px solid rgba(255, 215, 0, 0.1);
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 900;
            color: var(--accent);
        }

        .stat-label {
            color: var(--text-muted);
            font-size: 0.9rem;
            text-transform: uppercase;
            margin-top: 5px;
        }

        /* Progress Bar */
        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 30px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), #FDB931);
            transition: width 0.5s ease;
        }

        .back-nav {
            position: fixed;
            top: 20px;
            left: 20px;
            color: #fff;
            text-decoration: none;
            background: rgba(255, 255, 255, 0.1);
            padding: 10px 20px;
            border-radius: 50px;
            backdrop-filter: blur(5px);
            transition: 0.3s;
            z-index: 100;
        }

        .back-nav:hover {
            background: var(--accent);
            color: var(--primary);
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2.5rem;
            }

            .timer {
                font-size: 2rem;
            }

            .question-text {
                font-size: 1.4rem;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="bg-particles"></div>
    <a href="index.html" class="back-nav"><i class="fas fa-arrow-left"></i> Accueil</a>

    <div class="container">
        <header class="animate__animated animate__fadeInDown">
            <h1><i class="fas fa-futbol"></i> Quiz Football</h1>
            <p class="subtitle">Testez vos connaissances sur le football mondial</p>
        </header>

        <div class="quiz-card animate__animated animate__fadeInUp">
            <!-- Quiz Interface -->
            <div id="quizInterface">
                <div class="timer-container">
                    <div class="timer" id="timer">
                        <i class="fas fa-clock"></i>
                        <span id="timeDisplay">00:30</span>
                    </div>
                    <div class="question-counter">
                        Question <span id="currentQ">1</span> / <span id="totalQ">10</span>
                    </div>
                </div>

                <div class="progress-bar">
                    <div class="progress-fill" id="progressBar" style="width: 10%;"></div>
                </div>

                <div class="question-section">
                    <h2 class="question-text" id="questionText">Chargement...</h2>
                    <div class="options-grid" id="optionsContainer"></div>
                </div>

                <div class="btn-container">
                    <button class="btn btn-secondary" id="btnSkip">Passer</button>
                    <button class="btn btn-primary" id="btnNext" disabled>Question Suivante</button>
                </div>
            </div>

            <!-- Results Interface -->
            <div id="resultsInterface" style="display: none;">
                <div class="results-card">
                    <h2 style="font-size: 2rem; margin-bottom: 20px;">🏆 Quiz Terminé !</h2>
                    <div class="score-display" id="finalScore">0/10</div>
                    <p class="score-message" id="scoreMessage">Excellent travail !</p>

                    <div class="stats-grid">
                        <div class="stat-item">
                            <div class="stat-value" id="correctCount">0</div>
                            <div class="stat-label">Correctes</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value" id="incorrectCount">0</div>
                            <div class="stat-label">Incorrectes</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value" id="timeSpent">0s</div>
                            <div class="stat-label">Temps Total</div>
                        </div>
                    </div>

                    <button class="btn btn-primary" onclick="location.reload()">
                        <i class="fas fa-redo"></i> Recommencer
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let quizData = [];
        let currentQuestion = 0;
        let score = 0;
        let timeLeft = 30;
        let timerInterval;
        let selectedAnswer = null;
        let totalTime = 0;
        let startTime = Date.now();

        const letters = ['A', 'B', 'C', 'D'];

        // Load questions from API
        async function loadQuizData() {
            try {
                const res = await fetch('../backend/api/quiz_list.php');
                const data = await res.json();

                if (data.success && data.data.length > 0) {
                    // Convert API format to quiz format
                    quizData = data.data.map(q => ({
                        question: q.question,
                        options: [q.option_a, q.option_b, q.option_c, q.option_d],
                        correct: parseInt(q.correct_option)
                    }));

                    // Shuffle questions
                    quizData = quizData.sort(() => Math.random() - 0.5);

                    // Limit to 10 questions
                    quizData = quizData.slice(0, 10);

                    loadQuestion();
                } else {
                    document.getElementById('questionText').textContent = 'Aucune question disponible pour le moment.';
                }
            } catch (error) {
                console.error('Erreur chargement quiz:', error);
                document.getElementById('questionText').textContent = 'Erreur de chargement du quiz.';
            }
        }

        function loadQuestion() {
            const q = quizData[currentQuestion];
            document.getElementById('questionText').textContent = q.question;
            document.getElementById('currentQ').textContent = currentQuestion + 1;
            document.getElementById('totalQ').textContent = quizData.length;

            const progress = ((currentQuestion + 1) / quizData.length) * 100;
            document.getElementById('progressBar').style.width = progress + '%';

            const container = document.getElementById('optionsContainer');
            container.innerHTML = '';

            q.options.forEach((option, index) => {
                const div = document.createElement('div');
                div.className = 'option';
                div.innerHTML = `
                    <div class="option-letter">${letters[index]}</div>
                    <span>${option}</span>
                `;
                div.onclick = () => selectOption(index, div);
                container.appendChild(div);
            });

            selectedAnswer = null;
            document.getElementById('btnNext').disabled = true;
            resetTimer();
        }

        function selectOption(index, element) {
            document.querySelectorAll('.option').forEach(opt => opt.classList.remove('selected'));
            element.classList.add('selected');
            selectedAnswer = index;
            document.getElementById('btnNext').disabled = false;
        }

        function nextQuestion() {
            clearInterval(timerInterval);

            const q = quizData[currentQuestion];
            const options = document.querySelectorAll('.option');

            options.forEach((opt, idx) => {
                opt.classList.add('disabled');
                if (idx === q.correct) {
                    opt.classList.add('correct');
                } else if (idx === selectedAnswer && selectedAnswer !== q.correct) {
                    opt.classList.add('incorrect');
                }
            });

            if (selectedAnswer === q.correct) {
                score++;
            }

            setTimeout(() => {
                currentQuestion++;
                if (currentQuestion < quizData.length) {
                    loadQuestion();
                } else {
                    showResults();
                }
            }, 1500);
        }

        function skipQuestion() {
            selectedAnswer = null;
            nextQuestion();
        }

        function resetTimer() {
            clearInterval(timerInterval);
            timeLeft = 30;
            updateTimerDisplay();

            timerInterval = setInterval(() => {
                timeLeft--;
                updateTimerDisplay();

                if (timeLeft <= 10) {
                    document.getElementById('timer').classList.add('warning');
                } else {
                    document.getElementById('timer').classList.remove('warning');
                }

                if (timeLeft <= 0) {
                    skipQuestion();
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            const mins = Math.floor(timeLeft / 60);
            const secs = timeLeft % 60;
            document.getElementById('timeDisplay').textContent =
                `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        function showResults() {
            clearInterval(timerInterval);
            totalTime = Math.floor((Date.now() - startTime) / 1000);

            document.getElementById('quizInterface').style.display = 'none';
            document.getElementById('resultsInterface').style.display = 'block';

            document.getElementById('finalScore').textContent = `${score}/${quizData.length}`;
            document.getElementById('correctCount').textContent = score;
            document.getElementById('incorrectCount').textContent = quizData.length - score;
            document.getElementById('timeSpent').textContent = totalTime + 's';

            const percentage = (score / quizData.length) * 100;
            let message = '';

            if (percentage === 100) message = '🏆 Parfait ! Vous êtes un expert !';
            else if (percentage >= 80) message = '🌟 Excellent ! Très bonne performance !';
            else if (percentage >= 60) message = '👍 Bien joué ! Continuez comme ça !';
            else if (percentage >= 40) message = '💪 Pas mal ! Encore un effort !';
            else message = '📚 Continuez à apprendre !';

            document.getElementById('scoreMessage').textContent = message;
        }

        document.getElementById('btnNext').onclick = nextQuestion;
        document.getElementById('btnSkip').onclick = skipQuestion;

        // Load quiz data and start
        loadQuizData();
    </script>
</body>

</html>
