<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Gestion Boutique - LPA Admin</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #0A2342;
            --secondary: #001B48;
            --accent: #FFD700;
            --text: #F8FAFC;
            --danger: #ef4444;
            --glass: rgba(0, 27, 72, 0.7);
        }

        body {
            margin: 0;
            font-family: "Segoe UI", sans-serif;
            background: var(--primary);
            color: var(--text);
            display: flex;
        }

        .sidebar {
            width: 260px;
            background: var(--secondary);
            height: 100vh;
            position: fixed;
            padding: 25px;
            border-right: 1px solid rgba(255, 215, 0, 0.2);
            z-index: 1001;
        }

        .sidebar h2 {
            color: var(--accent);
            text-align: center;
            margin-bottom: 40px;
        }

        .sidebar a {
            display: block;
            padding: 12px 16px;
            margin-bottom: 8px;
            color: #CBD5E1;
            text-decoration: none;
            border-radius: 10px;
            transition: 0.3s;
        }

        .sidebar a:hover,
        .sidebar a.active {
            background: rgba(255, 215, 0, 0.1);
            color: #fff;
        }

        .content {
            margin-left: 260px;
            padding: 40px;
            min-height: 100vh;
            width: calc(100% - 260px);
            box-sizing: border-box;
        }

        .card {
            background: var(--glass);
            padding: 25px;
            border-radius: 16px;
            border: 1px solid rgba(255, 215, 0, 0.15);
            margin-bottom: 30px;
        }

        .grid {
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 30px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px;
            margin-top: 5px;
            border-radius: 8px;
            border: 1px solid rgba(255, 215, 0, 0.2);
            background: rgba(0, 0, 0, 0.2);
            color: #fff;
            margin-bottom: 10px;
        }

        .btn {
            padding: 12px 20px;
            border-radius: 8px;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-accent {
            background: var(--accent);
            color: var(--primary);
            width: 100%;
        }

        .btn-danger {
            background: var(--danger);
            color: #fff;
            padding: 5px 10px;
            font-size: 12px;
            border-radius: 4px;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }

        .product-card {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            text-align: center;
        }

        .product-img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .status {
            font-size: 14px;
            margin-top: 5px;
        }

        /* ✨ PREMIUM TABLE STYLING */
        .order-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 10px;
        }

        .order-table th {
            text-align: left;
            padding: 15px;
            color: var(--accent);
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 1px;
        }

        .order-table td {
            background: rgba(0, 0, 0, 0.2);
            padding: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .order-table tr td:first-child {
            border-left: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px 0 0 12px;
        }

        .order-table tr td:last-child {
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 0 12px 12px 0;
        }
    </style>
</head>

<body>
    <div class="sidebar" id="sidebarMenu"></div>

    <div class="content">
        <h1>🛒 Gestion Boutique "TABOULOU YA MBODJA"</h1>

        <div class="grid">
            <div class="card">
                <h2>📦 Ajouter un Produit</h2>
                <input type="text" id="pName" placeholder="Nom du produit (ex: Maillot Home)">
                <textarea id="pDesc" placeholder="Description..."></textarea>
                <input type="number" id="pPrice" placeholder="Prix (ex: 15000)">
                <input type="number" id="pStock" placeholder="Stock initial (ex: 50)">
                <label style="color:var(--accent); font-weight:bold; font-size:13px;">Image du produit</label>
                <input type="file" id="pFile" accept="image/*">
                <button class="btn btn-accent" id="btnSave" onclick="saveProduct()">Enregistrer le produit</button>
                <div id="pStatus" class="status"></div>
            </div>

            <div class="card">
                <h2>🛍 Catalogue Actuel</h2>
                <div id="productList" class="product-grid"></div>
            </div>
        </div>

        <div class="card">
            <h2>📋 Commandes Récentes</h2>
            <div id="orderList">
                <p style="color:var(--text-muted); font-style:italic;">Les commandes s'afficheront ici...</p>
            </div>
        </div>
    </div>

    <script>
        const API = "../../backend/api/";

        function loadMenu() {
            document.getElementById("sidebarMenu").innerHTML = `
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 30px;">
                    <h2 style="margin:0; color:var(--accent);">⚽ LPA</h2>
                </div>
                <a href="dashboard.html">🎯 Tirage au Sort</a>
                <a href="manage_matches.html">🏟 Programmer Matchs</a>
                <a href="matches_calendar.html">📅 Calendrier & Résultats</a>
                <a href="manage_teams.html">📋 Gestion Équipes</a>
                <a href="manage_players.html">👥 Gestion Joueurs</a>
                <a href="players_stats.html">📊 Statistiques Joueurs</a>
                <a href="manage_extras.html">🔥 Gestion Extras</a>
                <a href="manage_boutique.html" class="active">🛒 Gestion Boutique</a>
                <a href="manage_reservations.html">📅 Réservations Stades</a>
                <a href="manage_blog.html">📰 Gestion Blog</a>
                <hr style="border:0; border-top:1px solid rgba(255,255,255,0.1); margin:20px 0;">
                <a href="../index.html">🌍 Page Publique</a>
                <a href="../../backend/auth/logout.php" style="color:var(--danger); margin-top:10px;">🚪 Déconnexion</a>
            `;
        }

        async function uploadFile(fileInput) {
            const file = fileInput.files[0];
            if (!file) return null;
            const formData = new FormData();
            formData.append("logo", file); // Uses existing upload_logo.php
            const res = await fetch(API + "upload_logo.php", { method: "POST", body: formData });
            const data = await res.json();
            return data.success ? data.data.url : null;
        }

        async function saveProduct() {
            const statusDiv = document.getElementById("pStatus");
            const btn = document.getElementById("btnSave");
            statusDiv.innerHTML = "Téléchargement de l'image...";
            btn.disabled = true;

            try {
                const imgUrl = await uploadFile(document.getElementById("pFile"));
                if (!imgUrl && document.getElementById("pFile").files.length > 0) throw new Error("Upload échoué.");

                const body = {
                    name: document.getElementById("pName").value,
                    description: document.getElementById("pDesc").value,
                    price: document.getElementById("pPrice").value,
                    stock: document.getElementById("pStock").value,
                    image_url: imgUrl || ""
                };

                const res = await fetch(API + "product_add.php", {
                    method: "POST", height: "application/json", body: JSON.stringify(body)
                });
                const data = await res.json();
                if (data.success) {
                    statusDiv.innerHTML = "<span style='color:#22c55e;'>Produit ajouté !</span>";
                    loadProducts();
                } else throw new Error(data.message);
            } catch (e) {
                statusDiv.innerHTML = "<span style='color:var(--danger);'>" + e.message + "</span>";
            } finally { btn.disabled = false; }
        }

        async function loadProducts() {
            const res = await fetch(API + "products_list.php");
            const data = await res.json();
            const list = document.getElementById("productList");
            if (!data.data || data.data.length === 0) {
                list.innerHTML = "<p>Aucun produit.</p>"; return;
            }
            list.innerHTML = data.data.map(p => `
      <div class="product-card">
        <img src="${p.image_url || 'https://via.placeholder.com/150'}" class="product-img">
        <div style="font-weight:bold;">${p.name}</div>
        <div style="color:var(--accent);">${p.price} FCFA</div>
        <button class="btn-danger" style="margin-top:10px;" onclick="deleteProduct(${p.id})">Supprimer</button>
      </div>
    `).join('');
        }

        async function deleteProduct(id) {
            if (!confirm("Supprimer ce produit ?")) return;
            await fetch(API + "product_delete.php", {
                method: "POST", body: JSON.stringify({ id })
            });
            loadProducts();
        }

        async function loadOrders() {
            const res = await fetch(API + "orders_list.php");
            const data = await res.json();
            const container = document.getElementById("orderList");

            if (!data.data || data.data.length === 0) {
                container.innerHTML = "<p style='color:var(--text-muted); font-style:italic;'>Aucune commande pour le moment.</p>";
                return;
            }

            container.innerHTML = `
                <table class="order-table">
                    <thead>
                        <tr>
                            <th>Client</th>
                            <th>Contact</th>
                            <th>Articles</th>
                            <th>Total</th>
                            <th>Statut</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${data.data.map(o => {
                let items = [];
                try { items = JSON.parse(o.items_json); } catch (e) { }
                const itemsStr = items.map(i => `<span style="display:block; font-size:11px;">• ${i.name} (x${i.quantity || 1})</span>`).join('');

                return `
                            <tr>
                                <td style="font-weight:bold;">${o.customer_name}</td>
                                <td>${o.customer_phone}</td>
                                <td>${itemsStr}</td>
                                <td style="color:var(--accent); font-weight:bold;">${o.total_price} FCFA</td>
                                <td>
                                    <span class="badge" style="background:${o.status === 'confirmed' ? 'rgba(34,197,94,0.2)' : (o.status === 'pending' ? 'rgba(255,215,0,0.2)' : 'rgba(148,163,184,0.2)')}; color:${o.status === 'confirmed' ? '#22c55e' : (o.status === 'pending' ? '#FFD700' : '#cbd5e1')}">
                                        ${o.status.toUpperCase()}
                                    </span>
                                </td>
                                <td>
                                    <select onchange="updateOrderStatus(${o.id}, this.value)" style="padding:10px; width:auto; border-radius:8px; cursor:pointer;">
                                        <option value="pending" ${o.status === 'pending' ? 'selected' : ''}>Attente</option>
                                        <option value="confirmed" ${o.status === 'confirmed' ? 'selected' : ''}>Confirmé</option>
                                        <option value="shipped" ${o.status === 'shipped' ? 'selected' : ''}>Expédié</option>
                                        <option value="cancelled" ${o.status === 'cancelled' ? 'selected' : ''}>Annulé</option>
                                    </select>
                                </td>
                            </tr>
                        `}).join('')}
                    </tbody>
                </table>
            `;
        }

        async function updateOrderStatus(id, status) {
            const res = await fetch(API + "order_update_status.php", {
                method: "POST",
                body: JSON.stringify({ id, status })
            });
            const data = await res.json();
            if (data.success) {
                loadOrders();
            } else {
                alert(data.message);
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            loadMenu();
            loadProducts();
            loadOrders();
        });
    </script>
</body>

</html>
