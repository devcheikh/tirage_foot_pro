<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Gestion des Rubriques - LPA Admin</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #0A2342;
            --secondary: #001B48;
            --accent: #FFD700;
            --text: #F8FAFC;
            --danger: #ef4444;
            --glass: rgba(0, 27, 72, 0.7);
        }

        body {
            margin: 0;
            font-family: "Segoe UI", sans-serif;
            background: var(--primary);
            color: var(--text);
            display: flex;
        }

        .sidebar {
            width: 260px;
            background: var(--secondary);
            height: 100vh;
            position: fixed;
            padding: 25px;
            border-right: 1px solid rgba(255, 215, 0, 0.2);
        }

        .sidebar h2 {
            color: var(--accent);
            text-align: center;
            margin-bottom: 40px;
        }

        .sidebar a {
            display: block;
            padding: 12px 16px;
            margin-bottom: 8px;
            color: #CBD5E1;
            text-decoration: none;
            border-radius: 10px;
            transition: 0.3s;
        }

        .sidebar a:hover,
        .sidebar a.active {
            background: rgba(255, 215, 0, 0.1);
            color: #fff;
        }

        .content {
            margin-left: 260px;
            padding: 40px;
            width: 100%;
            box-sizing: border-box;
        }

        .card {
            background: var(--glass);
            padding: 25px;
            border-radius: 16px;
            border: 1px solid rgba(255, 215, 0, 0.15);
            margin-bottom: 30px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px;
            margin-top: 5px;
            border-radius: 8px;
            border: 1px solid rgba(255, 215, 0, 0.2);
            background: rgba(0, 0, 0, 0.2);
            color: #fff;
        }

        .btn {
            padding: 12px 20px;
            border-radius: 8px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            width: 100%;
        }

        .btn-accent {
            background: var(--accent);
            color: var(--primary);
        }

        .btn-danger {
            background: var(--danger);
            color: #fff;
            padding: 5px 10px;
            font-size: 12px;
            border-radius: 4px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th,
        td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        th {
            color: var(--accent);
            text-transform: uppercase;
            font-size: 12px;
        }

        .status {
            margin-top: 10px;
            font-size: 14px;
            min-height: 20px;
        }

        label {
            display: block;
            margin-top: 15px;
            color: var(--accent);
            font-weight: bold;
            font-size: 13px;
        }
    </style>
</head>

<body>
    <div class="sidebar" id="sidebarMenu">
        <!-- Menu chargé par JS -->
    </div>

    <div class="content">
        <h1>Gestion des Rubriques (Extras)</h1>

        <div class="grid">
            <!-- PALMARES -->
            <div class="card">
                <h2>🏆 Ajouter un Palmarès</h2>
                <input type="text" id="palYear" placeholder="Année (ex: 2024)">
                <input type="text" id="palTeam" placeholder="Nom de l'équipe">
                <input type="text" id="palCat" placeholder="Catégorie (ex: U20)">
                <label>Logo du vainqueur (Import)</label>
                <input type="file" id="palFile" accept="image/*">
                <button class="btn btn-accent" id="btnPal" onclick="addExtra('palmares')">Ajouter</button>
                <div id="palStatus" class="status"></div>
                <div id="listPalmares"></div>
            </div>

            <!-- SPONSORS -->
            <div class="card">
                <h2>🤝 Ajouter un Sponsor</h2>
                <input type="text" id="spoName" placeholder="Nom du partenaire">
                <label>Logo du sponsor (Import)</label>
                <input type="file" id="spoFile" accept="image/*">
                <input type="text" id="spoLink" placeholder="Lien vers site (optionnel)">
                <button class="btn btn-accent" id="btnSpo" onclick="addExtra('sponsor')">Ajouter</button>
                <div id="spoStatus" class="status"></div>
                <div id="listSponsors"></div>
            </div>
        </div>

        <!-- LOCATIONS -->
        <div class="card">
            <h2>📍 Gestion des Terrains / Lieux</h2>
            <div class="grid">
                <div>
                    <input type="text" id="locName" placeholder="Nom du terrain">
                    <textarea id="locAddr" placeholder="Adresse / Description"></textarea>
                    <button class="btn btn-accent" id="btnLoc" onclick="addExtra('location')">Ajouter Lieu</button>
                    <div id="locStatus" class="status"></div>
                </div>
                <div id="listLocations"></div>
            </div>
        </div>
    </div>

    <script>
        const API = "../../backend/api/";

        async function callAPI(url, body) {
            const res = await fetch(API + url, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(body)
            });
            return res.json();
        }

        async function getJSON(url) {
            const res = await fetch(API + url);
            return res.json();
        }

        async function uploadFile(fileInput) {
            const file = fileInput.files[0];
            if (!file) return null;

            const formData = new FormData();
            formData.append("logo", file);

            const res = await fetch(API + "upload_logo.php", {
                method: "POST",
                body: formData
            });
            const data = await res.json();
            return data.success ? data.data.url : null;
        }

        async function addExtra(type) {
            let body = { type };
            let statusId = type === 'palmares' ? 'palStatus' : (type === 'sponsor' ? 'spoStatus' : 'locStatus');
            let btnId = type === 'palmares' ? 'btnPal' : (type === 'sponsor' ? 'btnSpo' : 'btnLoc');

            const statusDiv = document.getElementById(statusId);
            const btn = document.getElementById(btnId);

            statusDiv.innerHTML = "<span style='color:var(--accent); pulsate'>Traitement en cours...</span>";
            btn.disabled = true;

            try {
                if (type === 'palmares') {
                    body.year = document.getElementById("palYear").value;
                    body.team_name = document.getElementById("palTeam").value;
                    body.category = document.getElementById("palCat").value;

                    const fileInput = document.getElementById("palFile");
                    const url = await uploadFile(fileInput);
                    if (!url && fileInput.files.length > 0) throw new Error("Erreur upload logo.");
                    body.logo_url = url || "";
                } else if (type === 'sponsor') {
                    body.name = document.getElementById("spoName").value;
                    body.link_url = document.getElementById("spoLink").value;

                    const fileInput = document.getElementById("spoFile");
                    const url = await uploadFile(fileInput);
                    if (!url) throw new Error("Le logo est obligatoire.");
                    body.logo_url = url;
                } else if (type === 'location') {
                    body.name = document.getElementById("locName").value;
                    body.address = document.getElementById("locAddr").value;
                    body.map_url = "";
                }

                const res = await callAPI("extra_add.php", body);
                if (res.success) {
                    statusDiv.innerHTML = "<span style='color:#22c55e;'>Ajouté avec succès !</span>";
                    loadAll();
                } else {
                    throw new Error(res.message);
                }
            } catch (err) {
                statusDiv.innerHTML = "<span style='color:var(--danger);'>" + err.message + "</span>";
            } finally {
                btn.disabled = false;
            }
        }

        async function deleteExtra(type, id) {
            if (!confirm("Supprimer cet élément ?")) return;
            const res = await callAPI("extra_delete.php", { type, id });
            if (res.success) loadAll();
        }

        async function loadAll() {
            const pal = await getJSON("palmares_list.php");
            document.getElementById("listPalmares").innerHTML = `<table>${pal.data.map(r => `<tr><td>${r.year} - ${r.team_name}</td><td style='text-align:right;'><button class="btn-danger" onclick="deleteExtra('palmares', ${r.id})"><i class='fas fa-trash'></i></button></td></tr>`).join('')}</table>`;

            const spo = await getJSON("sponsors_list.php");
            document.getElementById("listSponsors").innerHTML = `<table>${spo.data.map(r => `<tr><td>${r.name}</td><td style='text-align:right;'><button class="btn-danger" onclick="deleteExtra('sponsor', ${r.id})"><i class='fas fa-trash'></i></button></td></tr>`).join('')}</table>`;

            const loc = await getJSON("locations_list.php");
            document.getElementById("listLocations").innerHTML = `<table>${loc.data.map(r => `<tr><td>${r.name}</td><td style='text-align:right;'><button class="btn-danger" onclick="deleteExtra('location', ${r.id})"><i class='fas fa-trash'></i></button></td></tr>`).join('')}</table>`;
        }

        function loadMenu() {
            document.getElementById("sidebarMenu").innerHTML = `
      <h2>⚽ LPA</h2>
      <a href="dashboard.html">🎯 Tirage</a>
      <a href="manage_matches.html">🏟 Programmer</a>
      <a href="matches_calendar.html">📅 Calendrier</a>
      <a href="manage_teams.html">📋 Équipes</a>
      <a href="manage_players.html">👥 Joueurs</a>
      <a href="players_stats.html">📊 Stats joueurs</a>
      <a href="manage_extras.html" class="active">🔥 Extras</a>
      <a href="manage_blog.html">📰 Blog</a>
      <a href="../index.html">🌍 Page publique</a>
      <a href="../../backend/auth/logout.php" style="color:red; margin-top:20px;">🚪 Déconnexion</a>
    `;
        }

        window.onload = () => {
            loadMenu();
            loadAll();
        };
    </script>
</body>

</html>
